<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Captura de cámara</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { margin: 0; background: #111; color: #fff; }
    .capture-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1e3a5f;
    }
    .capture-header a { color: #fff; }
    .video-wrap {
      position: relative;
      max-width: 100%;
      margin: 0 auto;
      background: #000;
    }
    #video-element {
      width: 100%;
      display: block;
    }
    #canvas { display: none; }
    #threat-overlay {
      display: none;
      position: absolute;
      inset: 12px;
      border: 4px solid #e53935;
      border-radius: 8px;
      pointer-events: none;
      animation: pulse 0.8s infinite alternate;
    }
    #threat-label {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(229, 57, 53, 0.9);
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
    }
    @keyframes pulse {
      from { box-shadow: 0 0 8px #e53935; }
      to { box-shadow: 0 0 24px #ff5252; }
    }
    .capture-controls {
      padding: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .capture-controls button {
      flex: 1;
      min-width: 140px;
    }
    #status-text { padding: 0 16px 8px; font-size: 14px; }
    #status-text.ok { color: #81c784; }
    #status-text.err { color: #ef5350; }
    .capture-footer {
      padding: 12px 16px 24px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="capture-header">
    <span>Captura de cámara</span>
    <a href="/">Ir al dashboard</a>
  </header>

  <p id="status-text">Conectando...</p>

  <section class="video-wrap">
    <video id="video-element" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <section id="threat-overlay">
      <p id="threat-label"></p>
    </section>
  </section>

  <section class="capture-controls">
    <button type="button" id="btn-stop">Detener captura</button>
    <button type="button" id="btn-reload">Recarga</button>
  </section>

  <audio id="alert-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE=" type="audio/wav">
  </audio>

  <footer class="capture-footer">
    Sistema local. Cero internet. Cero grabación en el dispositivo.
  </footer>

  <script src="/static/capture.js"></script>
</body>
</html>
