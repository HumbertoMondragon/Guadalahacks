<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENTINELA AI — Cámara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="capture-body">

  <header class="cap-topbar">
    <div class="cap-brand">⬡ SENTINELA AI</div>
    <div class="cap-record">
      <span class="live-dot"></span>
      GRABANDO
    </div>
    <a href="/" class="cap-back">← Dashboard</a>
  </header>

  <div class="cap-video-wrap">
    <video id="video-element" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- Corners decorativos -->
    <div class="cap-corner tl"></div>
    <div class="cap-corner tr"></div>
    <div class="cap-corner bl"></div>
    <div class="cap-corner br"></div>

    <!-- Línea de escaneo -->
    <div class="cap-scan-line"></div>

    <!-- Overlay de amenaza -->
    <div id="threat-overlay">
      <div id="threat-label"></div>
    </div>
  </div>

  <div class="cap-hud">
    <div class="hud-item">
      <span class="hud-label">ESTADO</span>
      <span id="status-text" class="err">Iniciando...</span>
    </div>
    <span class="hud-separator">|</span>
    <div class="hud-item">
      <span class="hud-label">MODELO</span>
      <span class="hud-val">YOLOv8</span>
    </div>
    <span class="hud-separator">|</span>
    <div class="hud-item">
      <span class="hud-label">DETECCIONES</span>
      <span class="hud-val hud-detect" id="detect-count">0</span>
    </div>
    <span class="hud-separator">|</span>
    <div class="hud-item">
      <span class="hud-label">UMBRAL</span>
      <span class="hud-val">85%</span>
    </div>
    <div style="flex:1"></div>
    <div class="cap-controls">
      <button class="cap-btn cap-btn-stop" id="btn-stop">■ DETENER</button>
      <button class="cap-btn cap-btn-reload" id="btn-reload">↺ RELOAD</button>
    </div>
  </div>

  <audio id="alert-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE=" type="audio/wav">
  </audio>

  <script>
    let detectionCount = 0;
    const origShowThreat = window._origShowThreat;

    // Patch para contar detecciones
    document.addEventListener('DOMContentLoaded', () => {
      const countEl = document.getElementById('detect-count');
      const observer = new MutationObserver(() => {
        const overlay = document.getElementById('threat-overlay');
        if (overlay && overlay.style.display !== 'none') {
          detectionCount++;
          if (countEl) countEl.textContent = detectionCount;
        }
      });
      const overlay = document.getElementById('threat-overlay');
      if (overlay) observer.observe(overlay, { attributes: true, attributeFilter: ['style'] });
    });
  </script>
  <script src="/static/capture.js"></script>
</body>
</html>
